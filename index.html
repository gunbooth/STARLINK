<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink • Unblocked Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .logo-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .hero-bg {
            background: radial-gradient(circle at center, rgba(255,255,255,0.04) 0%, transparent 70%);
        }

        .dark .hero-bg {
            background: radial-gradient(circle at center, rgba(0,0,0,0.08) 0%, transparent 70%);
        }

        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover {
            transform: translateY(-6px);
        }

        .nav-link {
            position: relative;
        }
        
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: currentColor;
            transition: width 0.3s ease;
        }
        
        .nav-link:hover:after {
            width: 100%;
        }
    </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen transition-colors duration-300">

    <!-- NAVBAR -->
    <nav class="border-b border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-xl fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <!-- LOGO -->
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 flex items-center justify-center overflow-hidden">
                    <img id="logo" 
                         src="logo-dark.png" 
                         alt="Starlink" 
                         class="w-9 h-9 object-contain transition-opacity duration-300 opacity-100 dark:opacity-100"
                         onerror="this.src='logo-light.png';">
                </div>
                <span class="logo-font text-3xl font-semibold tracking-tight">Starlink</span>
            </div>

            <!-- MENU -->
            <div class="hidden md:flex items-center gap-x-8 text-sm font-medium">
                <a href="#proxies" class="nav-link">Proxies</a>
                <a href="#games" class="nav-link">Games</a>
                <a href="#resources" class="nav-link">Resources</a>
                <a href="#about" class="nav-link">About</a>
            </div>

            <div class="flex items-center gap-x-4">
                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" 
                        class="w-9 h-9 flex items-center justify-center rounded-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors">
                    <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                    <i class="fa-solid fa-sun text-lg hidden dark:block"></i>
                </button>
                
                <!-- Search -->
                <div class="relative">
                    <input id="search-input" type="text" placeholder="Search..." 
                           onkeyup="filterSites()"
                           class="bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 focus:border-black dark:focus:border-white rounded-full px-5 py-2.5 pl-11 text-sm w-72 focus:outline-none transition-colors">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-zinc-500 dark:text-zinc-400"></i>
                </div>

                <a href="https://github.com/YOUR-USERNAME/starlink" target="_blank"
                   class="flex items-center gap-x-2 bg-black text-white dark:bg-white dark:text-black text-sm font-semibold px-6 py-2.5 rounded-full hover:opacity-90 transition-opacity">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero-bg pt-28 pb-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h1 class="text-6xl md:text-7xl font-semibold logo-font tracking-tighter mb-4">
                Your unblocked gateway
            </h1>
            <p class="text-xl md:text-2xl text-zinc-600 dark:text-zinc-400 max-w-3xl mx-auto">
                Clean. Minimal. Always available.<br>Proxies, games, tools — all in one place.
            </p>

            <div class="flex justify-center gap-5 mt-10">
                <a href="#proxies" class="bg-black text-white dark:bg-white dark:text-black font-medium px-9 py-4 rounded-full hover:opacity-90 transition-opacity flex items-center gap-2">
                    <i class="fa-solid fa-rocket"></i> Explore
                </a>
                <a href="#games" class="border-2 border-black dark:border-white font-medium px-9 py-4 rounded-full hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors flex items-center gap-2">
                    Play
                </a>
            </div>
        </div>
    </section>

    <!-- SECTIONS (example – same structure as before, just colors adapted) -->
    <section id="proxies" class="max-w-7xl mx-auto px-6 py-24">
        <h2 class="text-5xl font-semibold logo-font tracking-tight mb-12">Proxies</h2>
        <div id="proxies-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards will be injected here -->
        </div>
    </section>

    <!-- Repeat similar blocks for #games and #resources -->

    <script>
        // Simple sites array (expand as needed)
        const sites = [
            { category: "proxy", name: "CroxyProxy", url: "https://www.croxyproxy.com/", desc: "Fast & reliable" },
            { category: "proxy", name: "ProxySite", url: "https://www.proxysite.com/", desc: "Simple forwarding" },
            { category: "game", name: "Slope", url: "https://slope-game.github.io/", desc: "Endless runner" },
            // add more...
        ];

        function renderSites() {
            const grids = {
                proxy: document.getElementById('proxies-grid'),
                game: document.getElementById('games-grid') || document.createElement('div'), // fallback if no id
                resource: document.getElementById('resources-grid') || document.createElement('div')
            };

            Object.values(grids).forEach(g => g.innerHTML = '');

            sites.forEach(site => {
                const card = document.createElement('a');
                card.href = site.url;
                card.target = "_blank";
                card.className = "block bg-zinc-50 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-800 rounded-2xl p-6 hover:border-black dark:hover:border-white transition-colors group";
                card.innerHTML = `
                    <h3 class="text-xl font-semibold mb-2 group-hover:text-black dark:group-hover:text-white">${site.name}</h3>
                    <p class="text-zinc-600 dark:text-zinc-400 text-sm">${site.desc}</p>
                    <div class="mt-4 text-right">
                        <i class="fa-solid fa-arrow-up-right-from-square text-black dark:text-white opacity-50 group-hover:opacity-100"></i>
                    </div>
                `;
                if (grids[site.category]) grids[site.category].appendChild(card);
            });
        }

        function filterSites() {
            const term = document.getElementById('search-input').value.toLowerCase().trim();
            document.querySelectorAll('#proxies-grid a, #games-grid a, #resources-grid a').forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(term) || !term ? 'block' : 'none';
            });
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';

            // Force logo refresh (helps some browsers)
            const logo = document.getElementById('logo');
            const src = document.documentElement.classList.contains('dark') ? 'logo-dark.png' : 'logo-light.png';
            logo.src = src + '?t=' + new Date().getTime();
        }

        // Init
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        window.onload = () => {
            renderSites();
            // Initial logo set
            document.getElementById('logo').src = document.documentElement.classList.contains('dark') ? 'logo-dark.png' : 'logo-light.png';
        };
    </script>
</body>
</html>
